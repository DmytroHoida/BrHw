<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Crime – homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   CONFIG – tutaj wklejasz linki do nagrań i klucze odpowiedzi
   ---------------------------------------------------------------------
   media.*.url  – link z Google Drive (…/file/d/ID/view) albo z YouTube.
                  Strona sama zamieni go na wersję /preview do osadzenia.
   answers.*    – klucze odpowiedzi do zadań z nagraniem.
                  T/F: wpisz "T" albo "F".
                  Luki: kilka poprawnych wersji oddziel znakiem |
                        np. "living room|lounge"
   ===================================================================== */
const CONFIG = {
  media: {
    track06: { title: "Nagranie 06 – Crime announcement", type: "audio", url: "https://drive.google.com/file/d/1hVpLMs2z3kyLIrvpELXeifNIiCHlncoc/view?usp=drive_link" }
  },
  /* Luki: kilka poprawnych wersji oddziel znakiem |
     Słowa kluczowe: "KW: tall + slim"  – odpowiedź musi zawierać tall ORAZ slim (zdanie: duża litera + kropka)
                     "KW: desk/desks"   – desk LUB desks
                     "KWG: ..."         – to samo, ale bez wymogu dużej litery i kropki                     */
  answers: {
    listenShort: ["KW: desk/desks", "KW: park", "KW: tall + slim + fair"],   // zadanie: Usłyszysz dwukrotnie… (1–3)
    listenTF:    ["F", "F", "T", "F", "T"]                                   // zadanie: True / False (1–5)
  }
};
</script>
<style>
:root{
  --paper:#F3F6FA;
  --card:#FFFFFF;
  --ink:#1D2A3A;
  --muted:#5B6878;
  --line:#CBD5E1;
  --blue:#2D5B8A;
  --blue-soft:#E3ECF6;
  --roof:#B4472F;
  --key:#F2C94C;
  --ok:#2F8550;  --ok-bg:#E3F4E8;
  --bad:#C0392B; --bad-bg:#FBE6E3;
  --warn:#B7790B;--warn-bg:#FFF3D6;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Nunito",system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Baloo 2","Nunito",sans-serif;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;box-shadow:0 2px 0 var(--roof)}
.topbar nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;max-width:1000px;margin:0 auto;scrollbar-width:thin}
.topbar a{flex:0 0 auto;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.topbar a:hover{background:rgba(255,255,255,.22)}
.topbar a.done::after{content:" 🔑"}
.topbar a.sum{background:var(--key);color:var(--ink)}

/* hero */
.hero{max-width:1000px;margin:0 auto;padding:34px 18px 10px;display:flex;align-items:flex-end;gap:22px}
.hero svg{flex:0 0 auto;width:120px;height:auto}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:800;letter-spacing:-.5px}
.hero p{margin:6px 0 0;color:var(--muted);max-width:52ch}

main{max-width:1000px;margin:0 auto;padding:0 14px 40px}
.group{font-size:22px;color:var(--blue);margin:34px 4px 12px;padding-bottom:6px;border-bottom:2px solid var(--line)}

/* exercise card */
.ex{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px 18px 18px;margin:0 0 22px;position:relative}
.ex.extra{border-style:dashed;border-color:#9BB3CC}
.ex-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.door{flex:0 0 auto;width:44px;height:54px;border-radius:22px 22px 4px 4px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 24px "Baloo 2",sans-serif;position:relative}
.door::after{content:"";position:absolute;right:6px;top:36px;width:5px;height:5px;border-radius:50%;background:var(--key)}
.ex.extra .door{background:var(--roof)}
.ex-head h2{font-size:24px}
.tag{display:inline-block;font:700 13px "Nunito",sans-serif;background:var(--roof);color:#fff;border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.instr{margin:4px 0 14px;font-weight:600}
.hint{color:var(--muted);font-size:15px;margin:-8px 0 14px}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:800;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.small{padding:6px 12px;font-size:15px}
.score{font-weight:800;font-size:18px}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px;display:none;font-weight:600}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.keyword{display:none;margin-top:12px;background:var(--key);border-radius:10px;padding:12px 16px;font-weight:800;font-size:19px}
.keyword.show{display:block}
.keyword b{font-family:"Baloo 2",sans-serif;font-size:24px;letter-spacing:2px}

/* no select */
.noselect,.noselect *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* inputs */
input.gap,textarea{font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:8px;background:#fff;padding:4px 8px}
input.gap{min-width:120px;width:auto}
input.gap:focus,textarea:focus{border-color:var(--blue);outline:none}
.st-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.st-bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.st-form{border-color:var(--warn)!important;background:var(--warn-bg)!important}

/* word bank */
.bank{display:flex;flex-wrap:wrap;gap:8px;background:var(--blue-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.bank span{background:#fff;border:1.5px solid #9BB3CC;border-radius:999px;padding:2px 12px;font-weight:700}

/* list of gap sentences */
ol.items{margin:0;padding-left:1.6em}
ol.items li{margin:0 0 12px;padding-left:4px}

/* matching */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
.words{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.word{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;cursor:pointer;min-height:56px}
.word .n{font-weight:800;color:var(--muted);width:1.6em}
.word .w{flex:1;font-weight:700}
.word .slot{width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;background:#fff;flex:0 0 auto}
.word .slot{overflow:hidden}
.word .slot img{width:40px;height:40px;object-fit:cover}
.word.sel{border-color:var(--blue);background:var(--blue-soft)}
.pics{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:10px;position:sticky;top:70px}
.pic{border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;position:relative}
.pic img{width:100%;max-width:150px;height:auto;max-height:110px;object-fit:contain}
.pic .l{font-weight:800;color:var(--muted)}
.pic.used{opacity:.45}
.pic.sel{border-color:var(--blue);background:var(--blue-soft);opacity:1}
.pic .usedby{position:absolute;top:4px;right:6px;font-size:13px;font-weight:800;color:var(--blue)}
@media (max-width:700px){
  .match{grid-template-columns:1fr}
  .pics{grid-template-columns:repeat(4,1fr)!important}
  .pics{order:-1;position:sticky;top:56px;z-index:5;background:var(--card);padding:6px 0;gap:6px}
  .pic{padding:4px 2px 2px}
}

/* true/false */
.tf{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tf li{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.tf .t{flex:1}
.tf .n{font-weight:800;color:var(--muted)}
.tfb{display:flex;gap:6px}
.tfb button{width:44px;height:40px;border-radius:8px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800}
.tfb button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* media */
.media{background:var(--blue-soft);border-radius:12px;padding:12px;margin-bottom:16px}
.media .ttl{font-weight:800;margin-bottom:8px}
.media iframe{width:100%;border:0;border-radius:8px;background:#fff;display:block}
.media iframe.audio{height:110px}
.media iframe.video{aspect-ratio:16/9;height:auto}
.media audio{width:100%}
.media a{display:inline-block;margin-top:8px;font-weight:700;color:var(--blue)}
.media .missing{color:var(--muted);font-style:italic}

/* email */
.email{border:2px solid var(--line);border-radius:12px;overflow:hidden;max-width:640px}
.email .bar{background:#E8ECF1;padding:8px 14px;font-size:15px;color:var(--muted);border-bottom:2px solid var(--line)}
.email .body{padding:16px;line-height:2.3}
.email sup{font-weight:800;color:var(--blue);margin-right:2px}

/* reading */
.reading{background:#FBFCFE}
.reading h3{font:800 26px "Baloo 2",sans-serif;text-align:center;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:14px;letter-spacing:.5px}
.reading img{float:left;width:min(46%,240px);margin:4px 18px 10px 0;border-radius:6px}
.reading p{margin:0;max-width:68ch;line-height:1.7}
.reading::after{content:"";display:block;clear:both}
.textlink{font-weight:700;color:var(--blue)}
/* open questions */
.open li{margin-bottom:16px}
.open .q{font-weight:700;margin-bottom:6px}
.open input.gap{width:100%;max-width:640px}
.summarytext{line-height:2.4;max-width:70ch}
.summarytext sup{font-weight:800;color:var(--blue);margin-right:2px}

/* articles */
.art{border-top:2px solid var(--line);padding:14px 0 10px}
.art:first-child{border-top:0;padding-top:0}
.art::after{content:"";display:block;clear:both}
.art h3{font:800 21px "Baloo 2",sans-serif;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.art .flag{width:40px;height:auto;border:1px solid var(--line)}
.art .ph{float:right;width:min(42%,250px);margin:2px 0 10px 16px;border-radius:6px}
.art p{margin:0;line-height:1.7;max-width:70ch}
.art b{color:var(--roof)}
.gapmark{display:inline-block;min-width:3.2em;text-align:left;padding:0 6px;border-radius:4px;background:repeating-linear-gradient(135deg,#D5DDE7 0 4px,#EEF2F7 4px 8px);font-weight:800;font-size:13px;color:var(--ink)}
@media (max-width:560px){.art .ph{float:none;display:block;width:100%;margin:6px 0 10px}}
/* choose a–c */
.opts{list-style:none;margin:0 0 14px;padding:10px 14px;background:var(--blue-soft);border-radius:10px;display:grid;gap:4px}
.opts b{color:var(--blue)}
.choose{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.choose li{border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.choose .ch{font-weight:800;color:var(--blue);font-size:15px}
.choose p{margin:4px 0 8px}
.chosen{font-weight:800;border-bottom:2px solid var(--blue)}
.chosen.empty{color:var(--muted);border-bottom-style:dashed}
/* notes */
.notes{position:relative;max-width:560px;padding:16px 18px 18px;border:2px solid var(--line);border-radius:10px;line-height:2.4;
  background-color:#fff;background-image:linear-gradient(#E8EEF5 1px,transparent 1px),linear-gradient(90deg,#E8EEF5 1px,transparent 1px);background-size:22px 22px}
.notes input.gap{max-width:100%}
.notes .nt{font:800 30px "Baloo 2",sans-serif;color:var(--blue);line-height:1.2;margin-bottom:6px}
.notes img{float:right;width:110px;margin:0 0 6px 10px}
.notes sup{font-weight:800;color:var(--blue);margin-right:2px}

/* photos */
.pw{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pwc{border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.pwi{position:relative}
.pwi img{width:100%;aspect-ratio:1.1;object-fit:cover;border-radius:6px;display:block}
.pwn{position:absolute;top:6px;left:6px;background:var(--ink);color:#fff;font-weight:800;border-radius:6px;padding:0 8px}
.pwp{font:700 18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-align:center}
.pwc input.gap{width:100%;min-width:0}
/* look box + bubbles */
.look{border:2px solid #E5A93B;border-radius:14px;padding:10px 16px;margin-bottom:14px;max-width:560px}
.look .lt{font:800 22px "Baloo 2",sans-serif;color:#C98A12}
.look .lp{margin-right:22px;white-space:nowrap;font-size:18px}
.look .lp b{color:#E5A93B}
.bubbles{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-width:560px}
.bub{align-self:flex-start;border:2px solid #6BAF63;border-radius:12px;padding:6px 14px;font-weight:700;background:#fff}
.bub.r{align-self:flex-end}
/* headlines */
.headlines{counter-reset:h;max-width:720px}
.headlines > div{counter-increment:h;position:relative;background:#F5F5F2;border-radius:4px;padding:10px 14px 10px 44px;box-shadow:0 3px 0 #C9C9C3;margin-bottom:14px;font:700 18px/2.3 Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.3px}
.headlines > div::before{content:counter(h);position:absolute;left:14px;top:10px;color:var(--muted);font-family:"Nunito",sans-serif}
.headlines sup{font-family:"Nunito",sans-serif;color:var(--blue);margin-right:2px}
.headlines input.gap{text-transform:none;font:600 17px "Nunito",sans-serif;letter-spacing:0;max-width:100%}
/* pick */
.pick li{line-height:2.4}
.pg{display:inline-flex;align-items:center;gap:2px;border:2px solid transparent;border-radius:9px;padding:0 2px}
.pg button{border:2px solid var(--line);background:#fff;border-radius:7px;padding:1px 8px;font-weight:700;font-style:italic;color:var(--ink)}
.pg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.pg .sl{color:var(--muted);padding:0 2px}
/* article */
.artpics{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;max-width:720px}
.artpic{border:3px solid var(--line);border-radius:12px;background:#fff;padding:8px;text-align:left;display:flex;flex-direction:column;gap:8px}
.artpic .bank{margin:0;justify-content:center}
.artpic img{width:100%;border-radius:6px}
.artpic .lab{font-weight:800;text-align:center;color:var(--muted)}
.artpic[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.artpic[aria-pressed="true"] .lab{color:var(--blue)}
.artpic[aria-pressed="true"] .lab::before{content:"✓ "}
@media (max-width:560px){.artpics{grid-template-columns:1fr}}
.paper{max-width:720px;background:#fff;border:2px solid var(--line);border-radius:4px;padding:14px 18px;box-shadow:4px 4px 0 #D5DDE7}
.paper .bn{font:800 34px "Baloo 2",sans-serif;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-bottom:12px;letter-spacing:1px}
.paper .bn span{color:#9AA6B5}
.paper textarea{border:0;border-radius:0;background:repeating-linear-gradient(#fff 0 31px,#C9D2DC 31px 32px);line-height:32px;padding:0 4px;font-family:Georgia,"Times New Roman",serif;font-size:18px;min-height:288px}

/* teacher-checked writing */
.tag.teacher{background:var(--blue)}
.ex:has(.tnote){border-color:var(--blue);border-width:3px}
.tnote{background:var(--warn-bg);border-left:6px solid var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:16px;line-height:1.6}
.lpform{border:2px solid var(--ink);border-radius:6px;padding:10px 14px;max-width:640px;margin-bottom:18px}
.lph{font-weight:800;margin-bottom:6px}
.lprow{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:8px}
.lprow.three{grid-template-columns:1fr 1fr 1fr}
.lpform label{display:flex;align-items:center;gap:6px;min-width:0}
.lpform label span{white-space:nowrap;font-weight:600}
.lpform input.gap{flex:1;min-width:0;width:100%}
@media (max-width:600px){.lprow,.lprow.three{grid-template-columns:1fr}}
.wdlg{max-width:720px}
.wdh{font-weight:800;margin-bottom:6px}
.wl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wl .who{font-weight:800;color:var(--muted);min-width:3.2em}
.wl .pre{white-space:nowrap}
.wl input.gap{flex:1;min-width:0}

/* wordsearch */
.ws{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:16px}
.wsgrid{display:grid;grid-template-columns:repeat(var(--w),1fr);border:2px solid var(--ink);width:min(100%,430px)}
.cell{aspect-ratio:1;border:1px solid #9AA6B5;background:#fff;font:800 clamp(15px,4.2vw,21px) "Nunito",sans-serif;color:var(--ink);padding:0;touch-action:manipulation}
.cell.start{background:var(--blue);color:#fff}
.cell.found{background:var(--key)}
.cell.miss{background:var(--bad-bg)}
.wsinfo{font-weight:800;color:var(--blue)}
.wstable{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px dashed #9AA6B5;border-radius:8px;max-width:520px;overflow:hidden}
.wscol{display:flex;flex-direction:column}
.wscol + .wscol{border-left:2px dashed #9AA6B5}
.wsh{font-weight:800;text-align:center;padding:6px;background:var(--blue-soft)}
.wscol input.gap{border-radius:0;border-width:0 0 1px 0;border-color:var(--line);min-width:0;width:100%}
/* dialogue text with gaps */
.dlgtext{line-height:2.2;max-width:72ch}
.dlgtext > div{padding-left:2em;text-indent:-2em}
.dlgtext sup{font-weight:800;color:var(--blue);margin-right:2px}
.dlgtext input.gap{max-width:100%;text-indent:0}
.photo{display:block;width:min(100%,360px);border-radius:8px;margin:0 0 14px}
/* self-check */
.roles button[aria-pressed="true"]{background:var(--blue);color:#fff}
.scprog{height:10px;border-radius:999px;background:var(--blue-soft);overflow:hidden;max-width:560px}
.scprog span{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.sccount{font-weight:700;color:var(--muted);margin:6px 0 10px;font-size:15px;white-space:pre}
.sccard{max-width:560px;min-height:170px;border:2px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:22px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.scq{font:800 clamp(22px,5vw,30px)/1.2 "Baloo 2",sans-serif}
.sca{font-size:20px;font-weight:700;color:var(--blue);visibility:hidden}
.sca.on{visibility:visible}
.btn.ok{background:var(--ok)}
.btn.no{background:var(--bad)}
.btn[hidden]{display:none}

/* phrases */
.phrases{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.phrases li{border:2px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.phrases .en{font-weight:800;transition:filter .2s}
.phrases .pl{color:var(--muted);font-size:15px}
.phrases.covered li{cursor:pointer}
.phrases.covered .en{filter:blur(7px)}
.phrases.covered li.peek .en{filter:none}

/* sentence building */
.build li{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips span{background:var(--blue-soft);border-radius:6px;padding:1px 9px;font-weight:700}
.build input.gap{width:100%;max-width:520px}

/* ordering */
.order{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.order li{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;cursor:grab}
.order li.dragging{opacity:.75;border-color:var(--blue);box-shadow:0 6px 18px rgba(29,42,58,.18);cursor:grabbing}
.order .handle{touch-action:none;font-size:20px;color:var(--muted);padding:0 4px;cursor:grab}
.order .who{font-weight:800;color:var(--blue);min-width:3.4em}
.order .txt{flex:1}
.order .arrows{display:flex;flex-direction:column;gap:2px}
.order .arrows button{border:0;background:var(--blue-soft);color:var(--blue);border-radius:6px;width:34px;height:26px;font-weight:800}

/* roleplay */
.roles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.roles button[aria-pressed="true"]{background:var(--blue);color:#fff}
.dlg{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dlg li{display:flex;gap:10px;padding:6px 10px;border-radius:8px}
.dlg li:nth-child(odd){background:var(--blue-soft)}
.dlg .who{font-weight:800;min-width:3.4em}
.dlg li.hid .line{color:transparent;background:repeating-linear-gradient(90deg,#B9C7D6 0 10px,transparent 10px 16px);border-radius:4px;cursor:pointer}
.lock{background:var(--blue-soft);border-radius:10px;padding:14px;font-weight:700;color:var(--muted)}

/* writing */
textarea{width:100%;min-height:200px;line-height:1.6}
.count{color:var(--muted);font-size:15px;margin-top:6px}

/* summary */
.summary{background:var(--ink);color:#fff;border-radius:var(--r);padding:22px 20px;margin-top:36px}
.summary h2{font-size:30px;margin-bottom:12px}
.summary ul{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px}
.summary li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.15);padding:6px 0}
.summary .got{color:var(--key);font-weight:800;letter-spacing:1px}
.summary .miss{color:#9FB0C3}
.summary .btn{background:var(--key);color:var(--ink)}
.summary .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.copied{margin-left:8px;font-weight:700}
.sumnote{color:#C9D4E1;font-size:15px}
footer{text-align:center;color:var(--muted);font-size:14px;padding:10px 0 30px}
</style>
</head>

function dk(s){ const b = atob(s); let o = ""; for (let i = 0; i < b.length; i++) o += String.fromCharCode(b.charCodeAt(i) ^ (23 + i)); return o.split("").reverse().join(""); }
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(k => { if (k != null) e.append(k.nodeType ? k : document.createTextNode(k)); });
  return e;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* blokada wklejania / kopiowania */
function guard(f){
  f.setAttribute("autocomplete","off"); f.setAttribute("autocorrect","off");
  f.setAttribute("autocapitalize","off"); f.setAttribute("spellcheck","false");
  ["paste","drop","copy","cut","dragstart","dragover"].forEach(ev => f.addEventListener(ev, e => e.preventDefault()));
  f.addEventListener("beforeinput", e => { if (/^insertFrom(Paste|Drop|Yank|PasteAsQuotation)$/.test(e.inputType)) e.preventDefault(); });
  return f;
}

/* ===================== SPRAWDZANIE (wyrozumiałe dla formy) ===================== */
const NOAPOS = { theres:"there is", isnt:"is not", arent:"are not", weve:"we have", ive:"i have", im:"i am",
  dont:"do not", doesnt:"does not", hasnt:"has not", havent:"have not", theyre:"they are", youre:"you are",
  its:"it is", hes:"he is", shes:"she is", whats:"what is", wheres:"where is", cant:"cannot", wont:"will not",
  couldnt:"could not", ll:"will", wasnt:"was not", werent:"were not", didnt:"did not", thats:"that is" };
const NUMS = { one:"1", two:"2", three:"3", four:"4", five:"5", six:"6", seven:"7", eight:"8", nine:"9", ten:"10",
  first:"1", second:"2", third:"3", fourth:"4", fifth:"5" };
function clean(s){ return String(s).replace(/[’‘`´]/g, "'").replace(/\s+/g, " ").trim(); }
function norm(s){
  let t = clean(s).toLowerCase().replace(/'/g, "").replace(/[.,!?;:"()\-–\/]/g, " ").replace(/\s+/g, " ").trim();
  t = t.replace(/\b(\d+)(st|nd|rd|th)\b/g, "$1");
  return t.split(" ").map(w => NOAPOS[w] || NUMS[w] || w).join(" ").replace(/\bcan not\b/g, "cannot");
}
function formIssues(u, e){
  u = clean(u); e = clean(e); const is = [];
  if (/^[A-Z]/.test(e) && /^[a-z]/.test(u)) is.push("cap");
  if (/\bI\b/.test(e) && /(^|[^A-Za-z'])i([^A-Za-z]|$)/.test(u)) is.push("I");
  const toks = u.toLowerCase().replace(/[.,!?;:"]/g, " ").split(/\s+/);
  if (e.includes("'") && toks.some(w => NOAPOS[w] && w !== "its")) is.push("apos");
  else if (/\bit's\b/i.test(e) && toks.includes("its")) is.push("apos");
  const end = e.slice(-1);
  if (end === "?" && u.slice(-1) !== "?") is.push("q");
  else if ((end === "." || end === "!") && !/[.!]$/.test(u)) is.push("dot");
  return is;
}
/* zwraca {state:'ok'|'form'|'bad'|'empty', issues:[]} */
function grade(user, alts){
  if (!clean(user)) return { state: "empty", issues: [] };
  const nu = norm(user);
  for (const a of alts){
    if (/^\s*KWG?:/i.test(a)){
      const pad = " " + nu + " ";
      const isGap = /^\s*KWG:/i.test(a);
      const groups = a.replace(/^\s*KWG?:/i, "").split("+").map(g => g.split("/").map(x => norm(x)).filter(Boolean));
      if (groups.length && groups.every(g => g.some(x => pad.includes(" " + x + " ")))){
        const is = formIssues(user, isGap ? "x" : "X.");
        return { state: is.length ? "form" : "ok", issues: is };
      }
      continue;
    }
    if (norm(a) === nu){
      const is = formIssues(user, a);
      return { state: is.length ? "form" : "ok", issues: is };
    }
  }
  return { state: "bad", issues: [] };
}
const ISSUE_TXT = {
  cap: "capital letters at the beginning of sentences",
  I: "writing “I” with a capital letter",
  apos: "apostrophes (e.g. there's, isn't, didn't)",
  dot: "a full stop at the end of sentences",
  q: "question marks at the end of questions"
};
function setState(f, s){
  f.classList.remove("st-ok","st-bad","st-form");
  if (s === "ok") f.classList.add("st-ok");
  else if (s === "form") f.classList.add("st-form");
  else if (s === "bad" || s === "empty") f.classList.add("st-bad");
}

function toEmbed(u){
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return { src: "https://www.youtube.com/embed/" + m[1], open: "https://www.youtube.com/watch?v=" + m[1] };
  m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]+)/);
  if (m) return { src: "https://drive.google.com/file/d/" + m[1] + "/preview", open: "https://drive.google.com/file/d/" + m[1] + "/view" };
  if (/\.(mp3|m4a|wav|ogg)(\?|$)/i.test(u)) return { audio: true, src: u, open: u };
  return { src: u, open: u };
}
function mediaBlock(key){
  const m = CONFIG.media[key] || {}; const url = (m.url || "").trim();
  const box = el("div", { class: "media" }, el("div", { class: "ttl" }, "🎧 " + (m.title || key)));
  if (!url){ box.append(el("div", { class: "missing" }, "The recording will appear here when your teacher adds the link.")); return box; }
  const e = toEmbed(url);
  if (e.audio) box.append(el("audio", { controls: "", preload: "none", src: e.src }));
  else box.append(el("iframe", { class: m.type === "audio" ? "audio" : "video", src: e.src, allow: "autoplay; encrypted-media", allowfullscreen: "", loading: "lazy", title: m.title || key }));
  box.append(el("br"), el("a", { href: e.open, target: "_blank", rel: "noopener" }, "Open it in a new tab"));
  return box;
}

  wordsearch(r){
    const ex = r.ex, s = st(ex.id); s.found = s.found || []; s.v = s.v || {};
    const [matW, patW] = atob(ex.words).split("|").map(x => x.split(","));
    const ALL = matW.concat(patW);
    const G = ex.grid, H = G.length, W = G[0].length;
    const wrap = el("div", { class: "ws noselect" });
    const grid = el("div", { class: "wsgrid", style: "--w:" + W });
    const cells = [];
    let start = null;
    G.forEach((row, y) => row.split("").forEach((ch, x) => {
      const c = el("button", { type: "button", class: "cell", "aria-label": ch }, ch);
      c.addEventListener("click", () => pick(y, x));
      cells.push(c); grid.append(c);
    }));
    const info = el("div", { class: "wsinfo" });
    function cell(y, x){ return cells[y * W + x]; }
    function paint(){
      cells.forEach(c => c.classList.remove("found", "start"));
      s.found.forEach(f => f.cells.forEach(([y, x]) => cell(y, x).classList.add("found")));
      if (start) cell(start[0], start[1]).classList.add("start");
      info.textContent = "Found: " + s.found.length + " / " + ALL.length;
    }
    function pick(y, x){
      if (!start){ start = [y, x]; paint(); return; }
      const [y0, x0] = start; start = null;
      const dy = Math.sign(y - y0), dx = Math.sign(x - x0);
      const len = Math.max(Math.abs(y - y0), Math.abs(x - x0)) + 1;
      if ((y !== y0 && x !== x0 && Math.abs(y - y0) !== Math.abs(x - x0)) || len < 2){ paint(); return; }
      let w = "", path = [];
      for (let i = 0; i < len; i++){ const yy = y0 + dy * i, xx = x0 + dx * i; w += G[yy][xx]; path.push([yy, xx]); }
      const rev = w.split("").reverse().join("");
      const hit = ALL.find(a => a === w || a === rev);
      if (hit && !s.found.some(f => f.w === hit)){ s.found.push({ w: hit, cells: path }); save(); }
      else { path.forEach(([yy, xx]) => { const c = cell(yy, xx); c.classList.add("miss"); setTimeout(() => c.classList.remove("miss"), 450); }); }
      paint();
    }
    wrap.append(grid, info); r.body.append(wrap);
    // table
    const table = el("div", { class: "wstable" });
    const cols = [[], []];
    ex.heads.forEach((h, ci) => {
      const col = el("div", { class: "wscol" }, el("div", { class: "wsh noselect" }, h));
      for (let i = 0; i < ex.rows; i++){
        const k = ci + "-" + i;
        const f = guard(el("input", { class: "gap", type: "text", "aria-label": h + " " + (i + 1) }));
        f.value = s.v[k] || "";
        f.addEventListener("input", () => { s.v[k] = f.value; save(); setState(f, ""); });
        cols[ci].push(f); col.append(f);
      }
      table.append(col);
    });
    r.body.append(table);
    paint();
    addControls(r, () => {
      const sets = [matW, patW]; const used = new Set(); let ok = 0, anyBad = false;
      cols.forEach((fs, ci) => fs.forEach(f => {
        const v = norm(f.value).toUpperCase();
        if (!v){ setState(f, ""); return; }
        if (sets[ci].includes(v) && !used.has(v)){ used.add(v); ok++; setState(f, "ok"); }
        else { anyBad = true; setState(f, "bad"); }
      }));
      report(r, ok, ALL.length, new Set(), true);
      if (ok < ALL.length && !anyBad) showFb(r, "bad", "Everything you wrote is correct, but some words are missing. Find all ten words!");
    }, () => { s.v = {}; s.found = []; start = null; save(); cols.flat().forEach(f => { f.value = ""; setState(f, ""); }); paint(); });
  },

      const c = ul.classList.toggle("covered");
      ul.querySelectorAll("li").forEach(li => li.classList.remove("peek"));
      btn.textContent = c ? "Show phrases" : "Cover phrases";
    });
    r.body.append(el("div", { class: "controls", style: "margin:0 0 12px" }, btn), ul);
  },

  build(r){
    const ex = r.ex, s = st(ex.id); s.v = s.v || {};
    const ol = el("ol", { class: "items build" }); const fields = [];
    ex.items.forEach(([chips, alts], i) => {
      const f = guard(el("input", { class: "gap", type: "text", "aria-label": "sentence " + (i + 1) }));
      f.value = s.v[i] || "";
      f.addEventListener("input", () => { s.v[i] = f.value; save(); setState(f, ""); });
      fields.push([f, alts]);
      ol.append(el("li", null, el("div", { class: "chips noselect" }, chips.map(c => el("span", null, c))), f));
    });
    r.body.append(ol);
    addControls(r, () => gradeFields(r, fields), () => { s.v = {}; save(); fields.forEach(([f]) => { f.value = ""; setState(f, ""); }); });
  },

  order(r){
    const ex = r.ex, s = st(ex.id), n = ex.lines.length;
    const mix = () => { let o; do { o = shuffle([...Array(n).keys()]); } while (o.every((v, i) => v === i)); return o; };
    if (!Array.isArray(s.o) || s.o.length !== n) { s.o = mix(); save(); }
    const ul = el("ul", { class: "order noselect" });
    function build(){
      ul.innerHTML = "";
      s.o.forEach((li, pos) => {
        const [who, txt] = ex.lines[li];
        const up = el("button", { type: "button", "aria-label": "Move up" }, "↑");
        const dn = el("button", { type: "button", "aria-label": "Move down" }, "↓");
        up.addEventListener("click", () => move(pos, pos - 1));
        dn.addEventListener("click", () => move(pos, pos + 1));
        const item = el("li", { "data-i": li },
          el("span", { class: "handle", "aria-hidden": "true" }, "⋮⋮"),
          el("span", { class: "who" }, who + ":"), el("span", { class: "txt" }, txt),
          el("span", { class: "arrows" }, up, dn));
        item.addEventListener("pointerdown", startDrag);
        ul.append(item);
      });
    }
    function move(a, b){ if (b < 0 || b >= n) return; const o = s.o; [o[a], o[b]] = [o[b], o[a]]; save(); build(); hideFb(r); }
    function startDrag(e){
      if (e.target.closest("button")) return;
      const isHandle = e.target.closest(".handle");
      if (e.pointerType === "mouse" ? e.button !== 0 : !isHandle) return;
      e.preventDefault();
      const item = e.currentTarget; let started = false; const y0 = e.clientY;
      const onMove = ev => {
        if (!started && Math.abs(ev.clientY - y0) < 4) return;
        started = true; item.classList.add("dragging");
        const others = [...ul.children].filter(c => c !== item);
        let before = null;
        for (const o of others){ const b = o.getBoundingClientRect(); if (ev.clientY < b.top + b.height / 2){ before = o; break; } }
        if (before) { if (item.nextSibling !== before) ul.insertBefore(item, before); }
        else if (ul.lastChild !== item) ul.append(item);
      };
      const onUp = () => {
        document.removeEventListener("pointermove", onMove); document.removeEventListener("pointerup", onUp); document.removeEventListener("pointercancel", onUp);
        item.classList.remove("dragging");
        if (started){ s.o = [...ul.children].map(c => +c.dataset.i); save(); build(); hideFb(r); }
      };
      document.addEventListener("pointermove", onMove); document.addEventListener("pointerup", onUp); document.addEventListener("pointercancel", onUp);
    }
    if (ex.photo) r.body.append(el("img", { class: "photo", src: IMAGES[ex.photo], alt: "Lost Property Office", draggable: "false" }));
    build(); r.body.append(ul);
    const mixBtn = el("button", { class: "btn ghost", type: "button", onclick: () => { s.o = mix(); save(); build(); hideFb(r); } }, "Mix again");
    addControls(r, () => {
      let ok = 0;
      [...ul.children].forEach((c, pos) => { const g = +c.dataset.i === pos; if (g) ok++; setState(c, g ? "ok" : "bad"); });
      report(r, ok, n, new Set(), ok < n);
    }, () => { s.o = mix(); save(); build(); }, mixBtn);
  },

  roleplay(r){
    const ex = r.ex; const src = EXERCISES.find(e => e.id === ex.from);
    const holder = el("div"); r.body.append(holder);
    const roles = [...new Set(src.lines.map(l => l[0]))];
    let hidden = null;
    function draw(){
      holder.innerHTML = "";
      if (!S.kw[src.id]){
        holder.append(el("div", { class: "lock" }, "🔒 First put the dialogue in order in exercise " + REG[src.id].num + "."));
        return;
      }
      const bar = el("div", { class: "roles" });
      const mk = (label, val) => { const b = el("button", { class: "btn ghost small", type: "button", "aria-pressed": String(hidden === val) }, label);
        b.addEventListener("click", () => { hidden = val; draw(); }); return b; };
      bar.append(mk("Show all", null), ...roles.map(ro => mk("Hide: " + ro, ro)));
      const ul = el("ul", { class: "dlg noselect" });
      src.lines.forEach(([who, txt]) => {
        const line = el("span", { class: "line" }, txt);
        const li = el("li", { class: who === hidden ? "hid" : "" }, el("span", { class: "who" }, who + ":"), line);
        line.addEventListener("click", () => { if (who === hidden) li.classList.toggle("hid"); });
        ul.append(li);
      });
      holder.append(bar, ul);
    }
    RENDERED_ROLEPLAY.push(draw); draw();
  },

  write(r){
    const ex = r.ex, s = st(ex.id);
    const ta = guard(el("textarea", { "aria-label": "Your text", placeholder: "Hi …!\n\nI live in a … . Downstairs, there's …" }));
    ta.value = s.t || "";
    const cnt = el("div", { class: "count" });
    const upd = () => { const w = (ta.value.trim().match(/\S+/g) || []).length; cnt.textContent = "Words: " + w; };
    ta.addEventListener("input", () => { s.t = ta.value; save(); upd(); });
    upd(); r.body.append(ta, cnt);
  }
};
const RENDERED_ROLEPLAY = [];

function gradeFields(r, fields){
  let ok = 0, anyBad = false; const issues = new Set();
  fields.forEach(([f, alts]) => {
    const g = grade(f.value, alts); setState(f, g.state);
    if (g.state === "ok") ok++;
    else if (g.state === "form") g.issues.forEach(i => issues.add(i));
    else anyBad = true;
  });
  report(r, ok, fields.length, issues, anyBad);
}

/* ===================== NAWIGACJA I PODSUMOWANIE ===================== */
const navEl = document.getElementById("nav");
function updateNav(){
  navEl.querySelectorAll("a[data-id]").forEach(a => a.classList.toggle("done", !!S.kw[a.dataset.id]));
}
let sumBox;
function renderSummary(){
  if (!sumBox) return;
  const withKw = Object.values(REG).filter(r => r.ex.kw);
  const written = Object.values(REG).filter(r => r.buildText);
  const got = withKw.filter(r => S.kw[r.ex.id]).length;
  sumBox.innerHTML = "";
  sumBox.append(el("h2", null, "Your keywords"), el("p", null, "Collected: " + got + " / " + withKw.length));
  const ul = el("ul");
  withKw.forEach(r => ul.append(el("li", null,
    el("span", null, "Exercise " + r.num + ": " + r.ex.title),
    S.kw[r.ex.id] ? el("span", { class: "got" }, dk(r.ex.kw)) : el("span", { class: "miss" }, "missing"))));
  written.forEach(r => ul.append(el("li", null,
    el("span", null, "Exercise " + r.num + ": " + r.ex.title + " (checked by teacher)"),
    r.isComplete() ? el("span", { class: "got" }, "✓ written") : el("span", { class: "miss" }, r.isStarted() ? "not finished" : "missing"))));
  const msg = el("span", { class: "copied", role: "status" });
  const copy = el("button", { class: "btn", type: "button" }, "Copy list");
  copy.addEventListener("click", () => {
    let txt = LESSON + " – keywords (" + got + "/" + withKw.length + ")\n" +
      withKw.map(r => "Exercise " + r.num + " (" + r.ex.title + "): " + (S.kw[r.ex.id] ? dk(r.ex.kw) : "—")).join("\n");
    written.forEach(r => { txt += "\n\n" + (r.isStarted() ? r.buildText() : "Exercise " + r.num + " (" + r.ex.title + "): —"); });
    copyText(txt).then(() => { msg.textContent = "Copied!"; setTimeout(() => msg.textContent = "", 2500); });
  });
  const reset = el("button", { class: "btn ghost", type: "button" }, "Start again");
  reset.addEventListener("click", () => {
    if (!confirm("Delete all your answers and keywords?")) return;
    try { localStorage.removeItem(SKEY); } catch (e) {}
    location.reload();
  });
  sumBox.append(ul);
  if (written.length) sumBox.append(el("p", { class: "sumnote" }, "“Copy list” copies your keywords and your dialogue – paste everything into your answer sheet."));
  sumBox.append(el("div", { class: "controls" }, copy, reset, msg));
}
function copyText(t){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).catch(() => fallback());
  return Promise.resolve(fallback());
  function fallback(){
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    const h = e => { e.stopImmediatePropagation(); }; document.addEventListener("copy", h, true);
    try { document.execCommand("copy"); } catch (e) {}
    document.removeEventListener("copy", h, true); ta.remove();
  }
}

/* ===================== START ===================== */
(function init(){
  const main = document.getElementById("main"); let num = 0;
  EXERCISES.forEach(ex => {
    if (ex.group){ main.append(el("h2", { class: "group" }, ex.group)); return; }
    const plain = ex.type === "reading";
    if (!plain) num++;
    const r = makeCard(ex, plain ? "" : num);
    main.append(r.sec);
    navEl.append(el("a", { href: "#ex-" + ex.id, "data-id": ex.id }, plain ? "Text: " + ex.title : num + ". " + ex.title));
  });
  Object.values(REG).forEach(r => RENDER[r.ex.type](r));
  sumBox = el("section", { class: "summary", id: "summary" });
  main.append(sumBox);
  navEl.append(el("a", { href: "#summary", class: "sum" }, "Your keywords"));
  renderSummary(); updateNav();
})();
</script>
